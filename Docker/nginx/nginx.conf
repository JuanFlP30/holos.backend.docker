server {
    listen 80;
    server_name _;
    root /var/www/polizas-backend/public;
    index index.php;

    server_tokens off;
    charset utf-8;
    client_max_body_size 20M;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off}; log_not_found off; }
    location = /robots.txt  { access_log off}; log_not_found off; }

    # Static assets: long cache, never executed
    location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Only the front controller may run PHP
    location = /index.php {
        fastcgi_pass polizas-backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git, ...) except ACME challenges
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
