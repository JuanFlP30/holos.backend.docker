services:
  polizas-backend:
    build:
      context: .
      dockerfile: dockerfile
    working_dir: /var/www/polizas-backend
    environment:
      - DB_HOST=mysql
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PORT=${DB_PORT}
      - HOME=/tmp
    volumes:
      - ./:/var/www/polizas-backend
      - /var/www/polizas-backend/vendor
    networks:
      - polizas-network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./public:/var/www/polizas-backend/public
      - ./storage:/var/www/polizas-backend/storage
      - ./Docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - polizas-network
    depends_on:
      - polizas-backend

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - polizas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 15s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - '${PMA_PORT}:80'
    depends_on:
        - mysql
    networks:
        - polizas-network

volumes:
  mysql_data:
    driver: local

networks:
  polizas-network:
    driver: bridge
