services:
  polizas-backend:
    build:
      context: .
      dockerfile: dockerfile
      target: dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    working_dir: /var/www/polizas-backend
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE is required}
      - HOME=/tmp
    volumes:
      - ./:/var/www/polizas-backend
      - vendor:/var/www/polizas-backend/vendor
    networks:
      - polizas-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/polizas-backend/public:ro
      - ./storage/app/public:/var/www/polizas-backend/storage/app/public:ro
      - ./Docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - polizas-network
    depends_on:
      polizas-backend:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required and must differ from DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host-only access; the app reaches MySQL on 3306 inside the network
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - polizas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 15s
      retries: 10

volumes:
  mysql_data:
    driver: local
  vendor:

networks:
  polizas-network:
    driver: bridge
